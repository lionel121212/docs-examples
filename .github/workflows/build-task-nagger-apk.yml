name: Build task-nagger APK

# Builds an installable Android APK of the task-nagger app (no Expo account needed).
# Run it from the Actions tab ("Run workflow"), or it runs on every push that touches task-nagger/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'task-nagger/**'
      - '.github/workflows/build-task-nagger-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: task-nagger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: task-nagger/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Unique version code for every build (Google Play needs a higher number each upload)
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build release APK (64- and 32-bit phones, signed with the debug key so it installs directly)
        working-directory: task-nagger/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk task-nagger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: task-nagger-apk
          path: task-nagger/task-nagger.apk

      - name: Publish to a GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: task-nagger-latest
          name: task-nagger (latest build)
          body: "Download `task-nagger.apk` on your phone and install it. Built from commit ${{ github.sha }}."
          files: task-nagger/task-nagger.apk
          make_latest: false

      # ---- Google Play upload bundle (only when the upload key secrets exist) ----
      - name: Decode upload key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks" && echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB for Google Play
        if: steps.key.outputs.ok == '1'
        working-directory: task-nagger/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease --no-daemon
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks"
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Keep the AAB as a private build artifact (not a public release)
        if: steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: task-nagger-play-aab
          path: task-nagger/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
