name: Build task-nagger APK

# Builds an installable Android APK of the task-nagger app (no Expo account needed).
# Run it from the Actions tab ("Run workflow"), or it runs on every push that touches task-nagger/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'task-nagger/**'
      - '.github/workflows/build-task-nagger-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: task-nagger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: task-nagger/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64 only, signed with the debug key so it installs directly)
        working-directory: task-nagger/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk task-nagger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: task-nagger-apk
          path: task-nagger/task-nagger.apk

      - name: Publish to a GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: task-nagger-latest
          name: task-nagger (latest build)
          body: "Download `task-nagger.apk` on your phone and install it. Built from commit ${{ github.sha }}."
          files: task-nagger/task-nagger.apk
          make_latest: false
