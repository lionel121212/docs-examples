name = "task-nagger-planner"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   ANTHROPIC_API_KEY   - required
#   ACCESS_CODES        - optional, comma separated tester codes
#   REVENUECAT_SECRET   - optional, enables paid subscribers

# Optional: rate limits for the free onboarding analysis.
# Create with `npx wrangler kv namespace create LIMITS` and paste the id here.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "<id>"

# Accounts + sync (D1). Create once:
#   npx wrangler d1 create task-nagger
#   npx wrangler d1 migrations apply task-nagger --remote
# then paste the database_id below and uncomment.
# [[d1_databases]]
# binding = "DB"
# database_name = "task-nagger"
# database_id = "<id>"
# migrations_dir = "migrations"
